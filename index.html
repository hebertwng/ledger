<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEDGER</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/ledger.svg" />
  <link rel="apple-touch-icon" href="assets/icons/ledger.svg" />
  <meta name="theme-color" content="#f2f4ef" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/reports.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script>
    // Aplica o tema (claro/escuro) e o menu recolhido antes da primeira pintura, sem piscar.
    try {
      var savedTheme = localStorage.getItem('ledger.theme');
      if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.setAttribute('data-theme', savedTheme);
      if (localStorage.getItem('ledger.sidebarCollapsed') === '1') document.documentElement.classList.add('sidebar-collapsed');
    } catch (error) {}
  </script>
</head>
<body>
  <script>
    // ES Modules não carregam via file:// (restrição de segurança de todo navegador moderno,
    // não um bug deste app) — avisa quem abrir o arquivo direto em vez de usar o servidor local.
    if (location.protocol === 'file:') {
      document.write(
        '<div style="background:#fee2e2;color:#991b1b;padding:16px 24px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;">' +
        '<strong>Este arquivo precisa ser aberto por um servidor local, não direto pelo file://.</strong><br>' +
        'No terminal, dentro da pasta do projeto, rode <code>npm start</code> e depois abra ' +
        '<code>http://localhost:5173</code> no navegador.' +
        '</div>'
      );
    }
  </script>
  <div class="app-shell">
    <aside id="app-nav" class="sidebar">
      <div class="sidebar__brand">
        <a href="#/dashboard" class="sidebar__logo">
          <img src="assets/icons/ledger.svg" alt="" width="30" height="30" />
          <span>LEDGER</span>
        </a>
        <button type="button" class="icon-button icon-button--outline sidebar__collapse" id="sidebar-collapse" data-icon="sidebar" data-icon-size="18"></button>
      </div>
      <nav class="sidebar__body">
        <ul class="sidebar__section">
          <li><a href="#/dashboard" data-route="/dashboard"><span class="sidebar__icon" data-icon="overview"></span><span class="sidebar__label" data-i18n="nav.dashboard"></span></a></li>
          <li><a href="#/transactions" data-route="/transactions"><span class="sidebar__icon" data-icon="transactions"></span><span class="sidebar__label" data-i18n="nav.transactions"></span></a></li>
          <li><a href="#/reports" data-route="/reports"><span class="sidebar__icon" data-icon="reports"></span><span class="sidebar__label" data-i18n="nav.reports"></span></a></li>
          <li><a href="#/budgets" data-route="/budgets"><span class="sidebar__icon" data-icon="budgets"></span><span class="sidebar__label" data-i18n="nav.budgets"></span></a></li>
          <li><a href="#/transfers" data-route="/transfers"><span class="sidebar__icon" data-icon="transfers"></span><span class="sidebar__label" data-i18n="nav.transfers"></span></a></li>
          <li><a href="#/invoices" data-route="/invoices"><span class="sidebar__icon" data-icon="invoices"></span><span class="sidebar__label" data-i18n="nav.invoices"></span></a></li>
        </ul>
        <ul class="sidebar__section">
          <li><a href="#/accounts" data-route="/accounts"><span class="sidebar__icon" data-icon="accounts"></span><span class="sidebar__label" data-i18n="nav.accounts"></span><span class="sidebar__count" id="nav-count-accounts" hidden></span></a></li>
          <li><a href="#/credit-cards" data-route="/credit-cards"><span class="sidebar__icon" data-icon="creditCards"></span><span class="sidebar__label" data-i18n="nav.creditCards"></span><span class="sidebar__count" id="nav-count-cards" hidden></span></a></li>
          <li><a href="#/categories" data-route="/categories"><span class="sidebar__icon" data-icon="categories"></span><span class="sidebar__label" data-i18n="nav.categories"></span></a></li>
          <li><a href="#/settings" data-route="/settings"><span class="sidebar__icon" data-icon="settings"></span><span class="sidebar__label" data-i18n="nav.settings"></span></a></li>
        </ul>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__profile">
          <span class="sidebar__avatar" id="sidebar-avatar">L</span>
          <span class="sidebar__profile-text">
            <strong id="sidebar-space-name">LEDGER</strong>
            <small><span id="app-state-badge"></span> · <span id="connectivity-badge"></span></small>
          </span>
        </div>
        <label class="sidebar__language">
          <span class="sidebar__icon" data-icon="globe" data-icon-size="18"></span>
          <span class="visually-hidden" data-i18n="language.label"></span>
          <select id="language-switcher"></select>
        </label>
      </div>
    </aside>
    <main id="app-main" class="app-main"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
