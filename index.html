<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEDGER</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/ledger.svg" />
  <link rel="apple-touch-icon" href="assets/icons/ledger.svg" />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
  <script>
    // ES Modules não carregam via file:// (restrição de segurança de todo navegador moderno,
    // não um bug deste app) — avisa quem abrir o arquivo direto em vez de usar o servidor local.
    if (location.protocol === 'file:') {
      document.write(
        '<div style="background:#fee2e2;color:#991b1b;padding:16px 24px;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5;">' +
        '<strong>Este arquivo precisa ser aberto por um servidor local, não direto pelo file://.</strong><br>' +
        'No terminal, dentro da pasta do projeto, rode <code>npm start</code> e depois abra ' +
        '<code>http://localhost:5173</code> no navegador.' +
        '</div>'
      );
    }
  </script>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <img class="app-header__mark" src="assets/icons/ledger.svg" alt="" width="30" height="30" />
        <span class="app-header__logo">LEDGER</span>
        <span class="app-header__tagline" data-i18n="app.tagline"></span>
      </div>
      <div class="app-header__status">
        <span id="app-state-badge" class="badge badge--state"></span>
        <span id="connectivity-badge" class="badge badge--connectivity"></span>
        <label class="language-switcher">
          <span data-i18n="language.label"></span>
          <select id="language-switcher"></select>
        </label>
      </div>
    </header>
    <div class="app-body">
      <nav id="app-nav" class="app-nav">
        <div class="app-nav__group">
          <a href="#/dashboard" data-route="/dashboard" title=""><span class="app-nav__icon" data-icon="overview"></span><span class="app-nav__label" data-i18n="nav.dashboard"></span></a>
          <a href="#/transactions" data-route="/transactions" title=""><span class="app-nav__icon" data-icon="transactions"></span><span class="app-nav__label" data-i18n="nav.transactions"></span></a>
          <a href="#/transfers" data-route="/transfers" title=""><span class="app-nav__icon" data-icon="transfers"></span><span class="app-nav__label" data-i18n="nav.transfers"></span></a>
          <a href="#/invoices" data-route="/invoices" title=""><span class="app-nav__icon" data-icon="invoices"></span><span class="app-nav__label" data-i18n="nav.invoices"></span></a>
          <a href="#/budgets" data-route="/budgets" title=""><span class="app-nav__icon" data-icon="budgets"></span><span class="app-nav__label" data-i18n="nav.budgets"></span></a>
          <a href="#/reports" data-route="/reports" title=""><span class="app-nav__icon" data-icon="reports"></span><span class="app-nav__label" data-i18n="nav.reports"></span></a>
        </div>
        <hr class="app-nav__divider" />
        <div class="app-nav__group">
          <a href="#/accounts" data-route="/accounts" title=""><span class="app-nav__icon" data-icon="accounts"></span><span class="app-nav__label" data-i18n="nav.accounts"></span></a>
          <a href="#/credit-cards" data-route="/credit-cards" title=""><span class="app-nav__icon" data-icon="creditCards"></span><span class="app-nav__label" data-i18n="nav.creditCards"></span></a>
          <a href="#/categories" data-route="/categories" title=""><span class="app-nav__icon" data-icon="categories"></span><span class="app-nav__label" data-i18n="nav.categories"></span></a>
          <a href="#/settings" data-route="/settings" title=""><span class="app-nav__icon" data-icon="settings"></span><span class="app-nav__label" data-i18n="nav.settings"></span></a>
        </div>
      </nav>
      <main id="app-main" class="app-main"></main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
